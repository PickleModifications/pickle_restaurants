<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    /* The props use an OPAQUE shader, so the texture's alpha is ignored — a
       transparent logo would show black. Fill the surface with a solid colour
       (overridable via the `bg` message field) so transparent logo areas read as
       packaging, not black. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #ffffff; overflow: hidden; }
    /* The image fills the whole DUI surface; each prop's UVs then map it onto its
       branded face. `cover` keeps the aspect ratio without letterboxing. */
    #brand { width: 100%; height: 100%; object-fit: cover; display: block; }
    #brand[src=""], #brand:not([src]) { display: none; }
  </style>
</head>
<body>
  <img id="brand" alt="" />
  <script>
    // The Lua render-target module pushes the current restaurant's image URL via
    // SendDuiMessage -> { action: "brand", url }. Swapping src is enough; the
    // runtime texture reads this surface every frame.
    var img = document.getElementById("brand");
    window.addEventListener("message", function (e) {
      var d = e.data;
      // SendDuiMessage delivers a raw JSON string; NUI-style delivery gives an
      // object. Handle both.
      if (typeof d === "string") { try { d = JSON.parse(d); } catch (_) { return; } }
      if (!d || d.action !== "brand") return;
      // optional background colour behind a transparent logo (default white)
      document.body.style.background = d.bg || "#ffffff";
      if (d.url) { img.setAttribute("src", d.url); }
      else { img.removeAttribute("src"); }
    });
  </script>
</body>
</html>
